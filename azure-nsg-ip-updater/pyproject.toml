[project]
name = "nsg-ip-updater"
version = "0.1.0"
description = "Keep an Azure NSG security rule pointed at this host's current public IP."
requires-python = ">=3.13"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
