name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    defaults:
      run:
        # The project lives in a subdirectory; its Makefile expects a venv at
        # ../.venv (the workspace root) — matching the local uv layout.
        working-directory: azure-nsg-ip-updater
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create workspace venv (../.venv)
        run: uv venv ../.venv --python 3.13

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test
